name: voice-clone-tts

# Todos os caminhos relativos são resolvidos a partir de deploy/.
# Suba com ./start.sh (na raiz) ou:
#   docker compose --env-file deploy/.env -f deploy/docker-compose.yml up -d

services:
  # ---------------------------------------------------------------------------
  # PocketBase — usuários da interface, tokens, clones, índice de cache e jobs
  # ---------------------------------------------------------------------------
  pocketbase:
    build:
      context: ../database
      dockerfile: Dockerfile
    image: voice-clone-tts/pocketbase:latest
    container_name: vct-pocketbase
    restart: unless-stopped
    environment:
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL:?defina PB_ADMIN_EMAIL no deploy/.env}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD:?defina PB_ADMIN_PASSWORD no deploy/.env}
      PB_INITIAL_USER_EMAIL: ${PB_INITIAL_USER_EMAIL:-}
      PB_INITIAL_USER_PASSWORD: ${PB_INITIAL_USER_PASSWORD:-}
      PB_INITIAL_USER_NAME: ${PB_INITIAL_USER_NAME:-Admin}
    volumes:
      - ../data/pocketbase:/pb/pb_data
    ports:
      - "${PB_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "/pb/pocketbase", "--help"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [vct]

  # ---------------------------------------------------------------------------
  # Backend — FastAPI + MOSS-TTS na GPU (porta 8096)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: voice-clone-tts/backend:latest
    container_name: vct-backend
    restart: unless-stopped
    depends_on:
      pocketbase:
        condition: service_healthy
    environment:
      API_PORT: 8096
      PB_URL: http://pocketbase:8090
      PB_ADMIN_EMAIL: ${PB_ADMIN_EMAIL}
      PB_ADMIN_PASSWORD: ${PB_ADMIN_PASSWORD}

      TTS_ENGINE: ${TTS_ENGINE:-moss}
      MOSS_MODEL_ID: ${MOSS_MODEL_ID:-OpenMOSS-Team/MOSS-TTS-Local-Transformer-v1.5}
      MOSS_MODEL_REVISION: ${MOSS_MODEL_REVISION:-}
      MOSS_DEVICE: ${MOSS_DEVICE:-cuda}
      MOSS_TOKENIZER_DEVICE: ${MOSS_TOKENIZER_DEVICE:-auto}
      MOSS_DTYPE: ${MOSS_DTYPE:-bfloat16}
      MOSS_ATTN_IMPLEMENTATION: ${MOSS_ATTN_IMPLEMENTATION:-auto}
      MOSS_PRELOAD: ${MOSS_PRELOAD:-true}
      MOSS_MAX_NEW_TOKENS: ${MOSS_MAX_NEW_TOKENS:-4096}

      TTS_TEMPERATURE: ${TTS_TEMPERATURE:-1.7}
      TTS_TOP_P: ${TTS_TOP_P:-0.8}
      TTS_TOP_K: ${TTS_TOP_K:-25}
      TTS_REPETITION_PENALTY: ${TTS_REPETITION_PENALTY:-1.0}
      TTS_DEFAULT_LANGUAGE: ${TTS_DEFAULT_LANGUAGE:-Portuguese}
      TTS_MAX_TEXT_LENGTH: ${TTS_MAX_TEXT_LENGTH:-5000}

      OPUS_BITRATE: ${OPUS_BITRATE:-64k}
      OPUS_CHANNELS: ${OPUS_CHANNELS:-1}
      OPUS_SAMPLE_RATE: ${OPUS_SAMPLE_RATE:-48000}
      OPUS_APPLICATION: ${OPUS_APPLICATION:-audio}

      CACHE_ENABLED: ${CACHE_ENABLED:-true}
      CACHE_MAX_GB: ${CACHE_MAX_GB:-20}

      QUEUE_MAX_SIZE: ${QUEUE_MAX_SIZE:-64}
      SYNC_TIMEOUT_SECONDS: ${SYNC_TIMEOUT_SECONDS:-300}
      JOB_RETENTION_HOURS: ${JOB_RETENTION_HOURS:-48}

      REQUEST_LOG_ENABLED: ${REQUEST_LOG_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      HF_HOME: /models
      PYTORCH_CUDA_ALLOC_CONF: ${PYTORCH_CUDA_ALLOC_CONF:-expandable_segments:True}
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
    volumes:
      - ../data/audio:/data/audio       # áudios .opus gerados (cache local)
      - ../data/voices:/data/voices     # áudios de referência dos clones
      - ../data/hf-cache:/models        # pesos do modelo (download único)
    ports:
      - "${API_PORT:-8096}:8096"
    shm_size: "2gb"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8096/health', timeout=5).status==200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 180s   # o 1º boot baixa ~10GB de pesos
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [vct]

  # ---------------------------------------------------------------------------
  # Frontend — interface web estilo Notion (porta 8095)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: voice-clone-tts/frontend:latest
    container_name: vct-frontend
    restart: unless-stopped
    depends_on:
      - pocketbase
      - backend
    environment:
      # Injetados em runtime no /config.js servido pelo nginx
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8096}
      APP_NAME: ${APP_NAME:-Voice Clone TTS}
    ports:
      - "${FRONTEND_PORT:-8095}:80"
    networks: [vct]

networks:
  vct:
    driver: bridge
