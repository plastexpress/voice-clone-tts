server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # upload do áudio de referência dos clones
    client_max_body_size 64m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # o resolver do Docker evita que o nginx morra se um upstream ainda não subiu
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ------------------------------------------------------------- PocketBase
    location /pb/ {
        set $pb_upstream pocketbase:8090;
        rewrite ^/pb/(.*)$ /$1 break;
        proxy_pass http://$pb_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;   # realtime/SSE do PocketBase
    }

    # ------------------------------------------------------- backend de TTS
    location /api/ {
        set $api_upstream backend:8096;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # geração de áudio pode demorar
        proxy_connect_timeout 15s;
        proxy_send_timeout    900s;
        proxy_read_timeout    900s;
        proxy_buffering       off;
    }

    # ------------------------------------------------------------- aplicação
    location = /config.js {
        add_header Cache-Control "no-store";
        try_files /config.js =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
